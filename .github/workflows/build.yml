name: Build SonarLite

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download SoundVolumeView (NirSoft)
        shell: pwsh
        run: |
          $h = @{ Referer = "https://www.nirsoft.net/utils/sound_volume_view.html" }
          Invoke-WebRequest "https://www.nirsoft.net/utils/soundvolumeview-x64.zip" -OutFile svv.zip -Headers $h -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          Expand-Archive svv.zip -DestinationPath svv
          Copy-Item svv\SoundVolumeView.exe .

      - name: Build portable app
        run: >
          pyinstaller --noconsole --onefile --name SonarLite
          --add-binary "SoundVolumeView.exe;."
          --add-data "version.txt;."
          --collect-all sounddevice
          --collect-submodules pycaw
          --collect-submodules comtypes
          sonarlite.py

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.v.outputs.version }} installer.iss
          Copy-Item dist\SonarLite.exe dist\SonarLite-Portable.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SonarLite ${{ steps.v.outputs.version }}
          body: |
            **Windows:** download SonarLite-Setup.exe to install, or SonarLite-Portable.exe to run without installing.
            If Windows says "Windows protected your PC", click More info, then Run anyway.

            **Before first use:** install virtual audio cables (VB-Cable or Voicemeeter), one per channel. Then in each channel's "Virtual device setup", set "Apps play to" to the cable's playback device and "Read from" to its recording side.
          files: |
            dist/SonarLite-Setup.exe
            dist/SonarLite-Portable.exe
          fail_on_unmatched_files: true
          overwrite_files: true
